name: BLZ Project CI Pipeline

# Ez a blokk mondja meg, mikor induljon el a pipeline
on:
  push:
    branches: ["master", "main"]
  pull_request:
    branches: ["master", "main"]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # 1. FELADAT: A Backend (C#) ellenőrzése és fordítása
  build-backend:
    name: Build .NET Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        working-directory: ./app/backend
        run: dotnet restore

      - name: Build backend
        working-directory: ./app/backend
        run: dotnet build --no-restore --configuration Release

  # 2. FELADAT: A Frontend (React) ellenőrzése és fordítása
  build-frontend:
    name: Build React Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm" # <--- Szupergyorsítás: megjegyzi a csomagokat
          cache-dependency-path: "./app/frontend/package-lock.json"

      - name: Install dependencies
        working-directory: ./app/frontend
        run: npm ci

      - name: Code Quality Check (Lint)
        working-directory: ./app/frontend
        run: npm run lint

      - name: Build frontend
        working-directory: ./app/frontend
        run: npm run build
